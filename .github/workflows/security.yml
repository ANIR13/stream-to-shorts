name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'   # every Monday, to catch newly published vulnerability patterns
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: Code scanning (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write   # upload the results to the Security tab
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript, actions
          queries: security-and-quality

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # comment on the pull request when something is found
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review new dependencies and actions
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure

      - name: No npm packages (project rule 1)
        run: npm run check
